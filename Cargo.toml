[package]
name = "opendeck-rotary-generic"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
dashmap = "6"
log = "0.4"
openaction = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simplelog = "0.12"
tokio = { version = "1", features = ["full"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
